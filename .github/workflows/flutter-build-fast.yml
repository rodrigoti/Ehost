name: Flutter Build (Fast) 

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome do App"
        required: false
        default: "Ehost Teste"
      api_url:
        description: "URL da API"
        required: false
        default: "https://acesso.ehostsolucoes.com.br/super/apps/?id=985"
      app_icon_color:
        description: "Cor Background do Ícone"
        required: false
        default: "#FFE05F"
      package_name:
        description: "Pacote do App (ex: com.appehost.ehost)"
        required: false
        default: "com.appehost.ehost"
      build_name:
        description: "Versão (ex: 0.0.1)"
        required: false
        default: "0.0.1"
      build_number:
        description: "Número interno (ex: 1)"
        required: false
        default: "1"

jobs:
  build-fast:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'

      # 3. Cache pub
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 4. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Substituir cores no pubspec.yaml
      - name: Update Colors in pubspec.yaml
        run: |
          sed -i "s|color: \".*\"|color: \"${{ github.event.inputs.app_icon_color }}\"|g" pubspec.yaml
          sed -i "s|adaptive_icon_background: \".*\"|adaptive_icon_background: \"${{ github.event.inputs.app_icon_color }}\"|g" pubspec.yaml
          cat pubspec.yaml

      # 6. Gerar splash e ícones
      - name: Generate Splash & Icons
        run: |
          flutter pub run flutter_native_splash:create
          flutter pub run flutter_launcher_icons:main

      # 6. Substituir variáveis
      - name: Configurar variáveis no código
        run: |
          echo "Substituindo variáveis..."
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ github.event.inputs.app_name }}\"|g" android/app/src/main/AndroidManifest.xml          
          sed -i "s|applicationId = \".*\"|applicationId = \"${{ github.event.inputs.package_name }}\"|g" android/app/build.gradle.kts


      # 7. Build APK debug rápido (somente arm64)
      - name: Build Fast APK
        run: |
          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --build-name=${{ github.event.inputs.build_name }} \
            --build-number=${{ github.event.inputs.build_number }} \
            --dart-define="APP_NAME=${{ github.event.inputs.app_name }}" \
            --dart-define="API_URL=${{ github.event.inputs.api_url }}" \
            --dart-define="APP_ICON_COLOR=${{ github.event.inputs.app_icon_color }}"

      # 8. Upload artefato
      - name: Upload Fast APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-fast-${{ github.event.inputs.build_name }}+${{ github.event.inputs.build_number }}
          path: build/app/outputs/flutter-apk/app-*.apk
