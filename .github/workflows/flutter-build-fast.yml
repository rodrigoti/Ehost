name: Flutter Build (Fast)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome do App"
        required: false
        default: "Ehost Teste"
      api_url:
        description: "URL da API"
        required: false
        default: "https://acesso.ehostsolucoes.com.br/super/apps/?id=985"
      app_icon_color:
        description: "Cor Background do Ícone"
        required: false
        default: "#FFE05F"
      package_name:
        description: "Pacote do App"
        required: false
        default: "com.appehost.ehost"
      build_name:
        description: "Versão (ex: 0.0.1)"
        required: false
        default: "1.0.0"
      build_number:
        description: "Número interno (ex: 1)"
        required: false
        default: "1"
      build_type:
        description: "Tipo de build (debug / release_aab_keystore)"
        required: true
        default: "debug"

concurrency:
  group: flutter-build-fast
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: "test-build"   # <--- nome do release fixo (mude aqui se quiser)

jobs:
  build-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Download image assets
        run: |
          mkdir -p assets/app
          curl -L https://acesso.ehostsolucoes.com.br/uploads/assets/logo.png -o assets/logo.png
          curl -L https://acesso.ehostsolucoes.com.br/uploads/assets/app/splash.png -o assets/app/splash.png
          curl -L https://acesso.ehostsolucoes.com.br/uploads/assets/app/icon.png -o assets/app/icon.png
          curl -L https://acesso.ehostsolucoes.com.br/uploads/assets/app/icon-android.png -o assets/app/icon-android.png

      - name: Download google-services.json
        run: |
          curl -fL https://acesso.ehostsolucoes.com.br/uploads/assets/google-services.json \
            -o android/app/src/google-services.json
          test -s android/app/src/google-services.json

      - name: Update Colors in pubspec.yaml
        run: |
          sed -i "s|color: \".*\"|color: \"${{ github.event.inputs.app_icon_color }}\"|g" pubspec.yaml
          sed -i "s|adaptive_icon_background: \".*\"|adaptive_icon_background: \"${{ github.event.inputs.app_icon_color }}\"|g" pubspec.yaml

      - name: Generate Splash & Icons
        run: |
          flutter pub run flutter_native_splash:create
          flutter pub run flutter_launcher_icons:main

      - name: Configurar variáveis no código
        run: |
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ github.event.inputs.app_name }}\"|g" android/app/src/main/AndroidManifest.xml
          sed -i "s|applicationId = \".*\"|applicationId = \"${{ github.event.inputs.package_name }}\"|g" android/app/build.gradle.kts

      # ---------------------------------------------------------
      # RELEASE KEYS — SOMENTE SE FOR release_aab_keystore
      # ---------------------------------------------------------
      - name: Download keystore
        if: ${{ github.event.inputs.build_type == 'release_aab_keystore' }}
        run: |
          curl -fL https://acesso.ehostsolucoes.com.br/uploads/assets/keystore.jks -o android/app/keystore.jks
          test -s android/app/keystore.jks

      # ---------------------------------------------------------
      # BUILD DEBUG — APENAS APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          flutter build apk --debug \
            --build-name=${{ github.event.inputs.build_name }} \
            --build-number=${{ github.event.inputs.build_number }} \
            --dart-define="APP_NAME=${{ github.event.inputs.app_name }}" \
            --dart-define="API_URL=${{ github.event.inputs.api_url }}" \
            --dart-define="APP_ICON_COLOR=${{ github.event.inputs.app_icon_color }}" \
            --dart-define="PACKAGE_NAME=${{ github.event.inputs.package_name }}"

      # ---------------------------------------------------------
      # BUILD RELEASE — APENAS AAB COM KEYSTORE
      # ---------------------------------------------------------
      - name: Build Release AAB (Keystore)
        if: ${{ github.event.inputs.build_type == 'release_aab_keystore' }}
        env:
          KEYSTORE_PATH: android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name=${{ github.event.inputs.build_name }} \
            --build-number=${{ github.event.inputs.build_number }} \
            --dart-define="APP_NAME=${{ github.event.inputs.app_name }}" \
            --dart-define="API_URL=${{ github.event.inputs.api_url }}" \
            --dart-define="APP_ICON_COLOR=${{ github.event.inputs.app_icon_color }}" \
            --dart-define="PACKAGE_NAME=${{ github.event.inputs.package_name }}"

      # =========================================================
      # UPLOAD ARTEFATOS PARA O RELEASE FIXO (test-build)
      # - removemos assets antigos (se houver) para manter 1 release limpo
      # - depois publicamos o novo asset
      # =========================================================

      - name: Install jq (used to parse JSON)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Prepare release (delete old assets if release exists)
        env:
          GITHUB_API: https://api.github.com/repos/${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          echo "Checking for existing release with tag: $RELEASE_TAG"
          res=$(curl -s -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API/releases/tags/$RELEASE_TAG")
          release_id=$(echo "$res" | jq -r '.id // empty')

          if [ -n "$release_id" ]; then
            echo "Found release id: $release_id — deleting existing assets..."
            asset_ids=$(echo "$res" | jq -r '.assets[]?.id // empty')
            for aid in $asset_ids; do
              echo "Deleting asset id: $aid"
              curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API/releases/assets/$aid"
            done
            echo "Old assets deleted (if any)."
          else
            echo "No existing release with tag $RELEASE_TAG (it will be created)."
          fi

      - name: Upload artifact to GitHub Release (test-build)
        # We use softprops/action-gh-release to (create +) upload; tag_name fixed to test-build
        uses: softprops/action-gh-release@v1
        if: ${{ github.event.inputs.build_type == 'debug' }}
        with:
          files: build/app/outputs/flutter-apk/app-debug.apk
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Test Build"
          body: |
            Build-type: debug
            Build name: ${{ github.event.inputs.build_name }}
            Build number: ${{ github.event.inputs.build_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAB to GitHub Release (test-build)
        uses: softprops/action-gh-release@v1
        if: ${{ github.event.inputs.build_type == 'release_aab_keystore' }}
        with:
          files: build/app/outputs/bundle/release/app-release.aab
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Test Build"
          body: |
            Build-type: release_aab_keystore
            Build name: ${{ github.event.inputs.build_name }}
            Build number: ${{ github.event.inputs.build_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
