name: Flutter Build (Fast) 

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome do App"
        required: false
        default: "Ehost Teste"
      api_url:
        description: "URL da API"
        required: false
        default: "https://acesso.ehostsolucoes.com.br/super/apps/?id=985"
      app_icon_color:
        description: "Cor Background do Ícone"
        required: false
        default: "#FFE05F"
      package_name:
        description: "Pacote do App (ex: com.appehost.ehost)"
        required: false
        default: "com.appehost.ehost"
      build_name:
        description: "Versão (ex: 0.0.1)"
        required: false
        default: "0.0.1"
      build_number:
        description: "Número interno (ex: 1)"
        required: false
        default: "1"
        
      build_type:
        description: "Tipo de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release_aab

      logo_url:
        description: "URL do logo"
        required: false
        default: "https://acesso.ehostsolucoes.com.br/uploads/assets/logo.png"

      splash_url:
        description: "URL da splash"
        required: false
        default: "https://acesso.ehostsolucoes.com.br/uploads/assets/app/splash.png"

      icon_url:
        description: "URL do ícone"
        required: false
        default: "https://acesso.ehostsolucoes.com.br/uploads/assets/app/icon.png"

      icon_android_url:
        description: "URL do ícone Android"
        required: false
        default: "https://acesso.ehostsolucoes.com.br/uploads/assets/app/icon-android.png"




# 🔹 Aqui está o bloqueio de concorrência
concurrency:
  group: flutter-build-fast
  cancel-in-progress: true

jobs:
  build-fast:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'

      # 3. Cache pub
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 4. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Download imagens (se fornecidas)
      - name: Download image assets
        run: |
          curl -L ${{ github.event.inputs.logo_url }} -o assets/logo.png
          curl -L ${{ github.event.inputs.splash_url }} -o assets/app/splash.png
          curl -L ${{ github.event.inputs.icon_url }} -o assets/app/icon.png
          curl -L ${{ github.event.inputs.icon_android_url }} -o assets/app/icon-android.png

      # 6. Substituir cores no pubspec.yaml
      - name: Update Colors in pubspec.yaml
        run: |
          sed -i "s|color: \".*\"|color: \"${{ github.event.inputs.app_icon_color }}\"|g" pubspec.yaml
          sed -i "s|adaptive_icon_background: \".*\"|adaptive_icon_background: \"${{ github.event.inputs.app_icon_color }}\"|g" pubspec.yaml
          cat pubspec.yaml

      # 6. Gerar splash e ícones
      - name: Generate Splash & Icons
        run: |
          flutter pub run flutter_native_splash:create
          flutter pub run flutter_launcher_icons:main

      # 6. Substituir variáveis
      - name: Configurar variáveis no código
        run: |
          echo "Substituindo variáveis..."
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ github.event.inputs.app_name }}\"|g" android/app/src/main/AndroidManifest.xml          
          sed -i "s|applicationId = \".*\"|applicationId = \"${{ github.event.inputs.package_name }}\"|g" android/app/build.gradle.kts


      # 7. Build APK debug rápido (somente arm64)
      # 5. Build de acordo com o tipo
      - name: Build Flutter (${{ github.event.inputs.build_type }})
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk \
              --debug \
              --target-platform android-arm64 \
              --build-name=${{ github.event.inputs.build_name }} \
              --build-number=${{ github.event.inputs.build_number }} \
              --dart-define="APP_NAME=${{ github.event.inputs.app_name }}" \
              --dart-define="API_URL=${{ github.event.inputs.api_url }}" \
              --dart-define="APP_ICON_COLOR=${{ github.event.inputs.app_icon_color }}"
          else
            flutter build appbundle \
              --release \
              --build-name=${{ github.event.inputs.build_name }} \
              --build-number=${{ github.event.inputs.build_number }} \
              --dart-define="APP_NAME=${{ github.event.inputs.app_name }}" \
              --dart-define="API_URL=${{ github.event.inputs.api_url }}" \
              --dart-define="APP_ICON_COLOR=${{ github.event.inputs.app_icon_color }}"
          fi

      # 6. Upload artefato - Debug
      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.event.inputs.build_name }}+${{ github.event.inputs.build_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk

      # 7. Upload artefato - Release AAB
      - name: Upload Release AAB
        if: ${{ github.event.inputs.build_type == 'release_aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release_aab-${{ github.event.inputs.build_name }}+${{ github.event.inputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
