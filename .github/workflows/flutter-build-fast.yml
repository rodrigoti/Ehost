name: Flutter Build (Fast)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome do App"
        required: false
        default: "Ehost Teste"
      api_url:
        description: "URL da API"
        required: false
        default: "https://acesso.ehostsolucoes.com.br/super/apps/?id=985"
      app_icon_color:
        description: "Cor Background do Ícone"
        required: false
        default: "#FFE05F"
      package_name:
        description: "Pacote do App"
        required: false
        default: "com.appehost.ehost"
      build_name:
        description: "Versão (ex: 1.0.0)"
        required: false
        default: "1.0.0"
      build_number:
        description: "Número interno"
        required: false
        default: "1"
      build_type:
        description: "debug / release_aab_keystore"
        required: true
        default: "debug"

concurrency:
  group: flutter-build-fast
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: test-build

jobs:
  build-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"

      - name: Install dependencies
        run: flutter pub get

      - name: Download Assets
        run: |
          mkdir -p assets/app
          curl -L "https://acesso.ehostsolucoes.com.br/uploads/assets/logo.png?$(date +%s)" -o assets/logo.png
          curl -L "https://acesso.ehostsolucoes.com.br/uploads/assets/app/splash.png?$(date +%s)" -o assets/app/splash.png
          curl -L "https://acesso.ehostsolucoes.com.br/uploads/assets/app/icon.png?$(date +%s)" -o assets/app/icon.png
          curl -L "https://acesso.ehostsolucoes.com.br/uploads/assets/app/icon-android.png?$(date +%s)" -o assets/app/icon-android.png

      - name: Firebase google-services.json
        run: |
          curl -fL https://acesso.ehostsolucoes.com.br/uploads/assets/google-services.json \
            -o android/app/src/google-services.json
          test -s android/app/src/google-services.json

      - name: Atualizar variáveis no pubspec
        run: |
          sed -i "s|color: \".*\"|color: \"${{ github.event.inputs.app_icon_color }}\"|g" pubspec.yaml
          sed -i "s|adaptive_icon_background: \".*\"|adaptive_icon_background: \"${{ github.event.inputs.app_icon_color }}\"|g" pubspec.yaml

      - name: Gerar Splash & Ícones
        run: |
          flutter pub run flutter_native_splash:create
          flutter pub run flutter_launcher_icons:main

      - name: Atualizar AndroidManifest & Gradle
        run: |
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ github.event.inputs.app_name }}\"|g" android/app/src/main/AndroidManifest.xml
          sed -i "s|applicationId = \".*\"|applicationId = \"${{ github.event.inputs.package_name }}\"|g" android/app/build.gradle.kts

      # ---------------------------------------------------------
      # BUILD RELEASE (AAB)
      # ---------------------------------------------------------
      - name: Download keystore
        if: ${{ github.event.inputs.build_type == 'release_aab_keystore' }}
        run: |
          curl -fL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
          https://acesso.ehostsolucoes.com.br/uploads/assets/keystore.jks \
          -o android/app/keystore.jks
          if [ -f android/app/keystore.jks ] && [ -s android/app/keystore.jks ]; then
            echo "Keystore file downloaded successfully."
          else
            echo "Failed to download keystore file."
            exit 1
          fi

      - name: Build Release AAB
        if: ${{ github.event.inputs.build_type == 'release_aab_keystore' }}
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name=${{ github.event.inputs.build_name }} \
            --build-number=${{ github.event.inputs.build_number }} \
            --dart-define="APP_NAME=${{ github.event.inputs.app_name }}" \
            --dart-define="API_URL=${{ github.event.inputs.api_url }}" \
            --dart-define="APP_ICON_COLOR=${{ github.event.inputs.app_icon_color }}" \
            --dart-define="PACKAGE_NAME=${{ github.event.inputs.package_name }}"

      # ---------------------------------------------------------
      # BUILD DEBUG (APK)
      # ---------------------------------------------------------
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          flutter build apk --debug \
            --build-name=${{ github.event.inputs.build_name }} \
            --build-number=${{ github.event.inputs.build_number }} \
            --dart-define="APP_NAME=${{ github.event.inputs.app_name }}" \
            --dart-define="API_URL=${{ github.event.inputs.api_url }}" \
            --dart-define="APP_ICON_COLOR=${{ github.event.inputs.app_icon_color }}" \
            --dart-define="PACKAGE_NAME=${{ github.event.inputs.package_name }}"

      # ---------------------------------------------------------
      # LIMPA E RECRIA RELEASE FIXO
      # ---------------------------------------------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Cleanup old release assets
        env:
          GITHUB_API: https://api.github.com/repos/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing release..."
          res=$(curl -s -H "Authorization: token $TOKEN" "$GITHUB_API/releases/tags/$RELEASE_TAG")
          release_id=$(echo "$res" | jq -r '.id // empty')

          if [ -n "$release_id" ]; then
            echo "Found release $release_id – deleting assets"
            asset_ids=$(echo "$res" | jq -r '.assets[].id')
            for id in $asset_ids; do
              curl -s -X DELETE -H "Authorization: token $TOKEN" "$GITHUB_API/releases/assets/$id"
            done
          else
            echo "No existing release. It will be created automatically."
          fi

      # ---------------------------------------------------------
      # UPLOAD DO ARTEFATO (APK OU AAB)
      # ---------------------------------------------------------
      - name: Upload APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/app/outputs/flutter-apk/app-debug.apk
          name: "Test Build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type == 'release_aab_keystore' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/app/outputs/bundle/release/app-release.aab
          name: "Test Build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
