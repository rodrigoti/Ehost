name: Flutter Build (Fast)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Tipo de build (debug ou release)"
        required: true
        default: "debug"
      app_name:
        description: "Nome do App"
        required: false
        default: "Ehost"
      api_url:
        description: "URL da API"
        required: false
        default: "https://acesso.ehostsolucoes.com.br/super/apps/?id=985"
      build_name:
        description: "Versão do App (ex: 1.2.5)"
        required: false
        default: "1.0.0"
      build_number:
        description: "Número interno (ex: 100)"
        required: false
        default: "1"
      package_name:
        description: "Pacote do App (applicationId ex: com.ehost.app)"
        required: false
        default: "com.appehost.ehost"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar Flutter (cache automático do SDK)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2' # ajuste para sua versão

      # 3. Cache das dependências do pub
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 4. Instalar dependências
      - name: Install dependencies
        run: flutter pub get

      # 5. Substituir variáveis no código (config.dart + Manifest + package_name)
      - name: Configurar variáveis no código
        run: |
          echo "Substituindo variáveis no código..."
          # Nome do app no Manifest
          sed -i "s|APP_NAME_PLACEHOLDER|${{ github.event.inputs.app_name }}|g" android/app/src/main/AndroidManifest.xml
          # Variáveis no config.dart
          sed -i "s|APP_NAME_PLACEHOLDER|${{ github.event.inputs.app_name }}|g" lib/config.dart || true
          sed -i "s|API_URL_PLACEHOLDER|${{ github.event.inputs.api_url }}|g" lib/config.dart || true
          # ApplicationId no build.gradle
          sed -i "s|applicationId \".*\"|applicationId \"${{ github.event.inputs.package_name }}\"|g" android/app/build.gradle

      # 6. Build APK (debug ou release, com versão e build number)
      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.build_mode }}" = "release" ]; then
            flutter build apk \
              --release \
              --build-name=${{ github.event.inputs.build_name }} \
              --build-number=${{ github.event.inputs.build_number }} \
              --no-shrink
          else
            flutter build apk \
              --debug \
              --target-platform android-arm64 \
              --build-name=${{ github.event.inputs.build_name }} \
              --build-number=${{ github.event.inputs.build_number }}
          fi

      # 7. Build AAB (apenas no release)
      - name: Build AAB
        if: ${{ github.event.inputs.build_mode == 'release' }}
        run: |
          flutter build appbundle \
            --release \
            --build-name=${{ github.event.inputs.build_name }} \
            --build-number=${{ github.event.inputs.build_number }}

      # 8. Upload artefatos (APK + AAB se existir)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_mode }}-${{ github.event.inputs.build_name }}+${{ github.event.inputs.build_number }}
          path: build/app/outputs/flutter-apk/app-*.apk

      - name: Upload AAB
        if: ${{ github.event.inputs.build_mode == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ github.event.inputs.build_name }}+${{ github.event.inputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
